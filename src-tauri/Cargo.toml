[package]
name = "mygitui"
version = "0.1.0"
description = "Fast, configurable Git GUI with AI-assisted workflows"
authors = ["raulshma"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mygitui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bench]]
name = "perf"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.2"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
git2 = "0.21.0"
imara-diff = "0.2.0"
regex = "1.11"
notify = "8.2.0"
ignore = "0.4"
tauri-plugin-deep-link = "2"
thiserror = "2.0.21"
parking_lot = "0.12.5"
tracing = "0.1.44"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-window-state = "2"
tokio = { version = "1.53.2", features = ["rt", "sync", "macros"] }
portable-pty = "0.9.0"
uuid = { version = "1.27.0", features = ["v4"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
criterion = "0.8.2"
git2 = "0.21.0"
proptest = "1"
sysinfo = "0.33"
