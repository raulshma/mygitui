# Linker flags for every target (app binary, cdylib, and test exes).
#
# Test binaries link tauri's windowing stack whenever a test reaches a
# runtime path (e.g. the auth broker's credentials callback). Those exes
# carry no common-controls SxS manifest — tauri-build embeds one into app
# binaries only — so muda's `TaskDialogIndirect` import resolves against
# the v5 comctl32.dll in System32, which lacks the export, and the exe
# dies at load time with STATUS_ENTRYPOINT_NOT_FOUND. Requesting the v6
# side-by-side assembly for all targets fixes test-exe loading; app
# binaries simply restate the dependency they already embed.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
    "-C",
    "link-arg=/MANIFESTDEPENDENCY:type='win32' name='Microsoft.Windows.Common-Controls' version='6.0.0.0' publicKeyToken='6595b64144ccf1df' language='*' processorArchitecture='*'",
]

# ts-rs binding exports (`cargo test export_bindings`, `npm run gen:types`):
# the generated `.ts` files land in the repo's `src/lib/ipc/gen/`. The value
# stays relative (resolved against the test binary's cwd, which cargo always
# sets to this crate root), so the output path is machine-independent.
[env]
TS_RS_EXPORT_DIR = "../src/lib/ipc/gen"
# 64-bit ints (unix seconds, byte counters) are `number` on the wire and in
# the FE types — keep the generated bindings in `number`, not `bigint`.
TS_RS_LARGE_INT = "number"
