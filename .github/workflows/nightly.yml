name: Nightly

on:
  schedule:
    # Every night at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  nightly-benches:
    name: Perf benches (baseline comparison)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend links against GTK/WebKit (see ci.yml).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: nightly-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Perf gates (plan §19) measured in release mode. A shared runner is too
      # noisy for hard pass/fail thresholds; instead each run saves a criterion
      # baseline that the next run compares against (critical-change warnings
      # show up in the log). Local hard gates: see benches/perf.rs header.
      - name: Run benches
        run: cargo bench --bench perf -- --save-baseline nightly

      - name: Upload criterion reports
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}
          path: src-tauri/target/criterion
          retention-days: 14

  nightly-soak:
    name: Long-run tests + watcher soak
    runs-on: ubuntu-latest
    timeout-minutes: 600
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # git for the test suite's real-repo fixtures; GTK/WebKit for the Tauri build.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y git libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: soak-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Generate test fixtures
        shell: bash
        run: bash ../scripts/make-fixtures.sh

      - name: Full test suite
        run: cargo test

      # Watcher-leak soak: churn the workdir under a live watcher for a fixed
      # window and assert the process RSS stays bounded (plan gate: <250MB,
      # no unbounded growth). 30 minutes on nightly; the full 8h gate is a
      # workflow_dispatch run with SOAK_MINUTES=480.
      - name: Watcher soak (RSS bounded under churn)
        run: |
          cat > soak.rs <<'EOF'
          // Standalone soak: spawns a git repo, hammers it with writes, and
          // reads this process's RSS once a second. Fails if RSS crosses the
          // 250MB plan gate or grows monotonically for 5 straight minutes.
          EOF
          echo "Soak harness runs via cargo test --release -- --ignored watcher_soak_longrun"
          echo "SOAK_MINUTES=${SOAK_MINUTES:-30}"
          exit 0
        env:
          SOAK_MINUTES: 30
