name: Nightly

on:
  schedule:
    # Every night at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  nightly-benches:
    name: Perf benches (baseline comparison)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend links against GTK/WebKit (see ci.yml).
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev pkg-config patchelf

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: nightly-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Perf gates (plan §19) measured in release mode. Each run downloads
      # the previous nightly's criterion baseline, compares against it, and
      # saves the new one. `--baseline` fails the run when a benchmark
      # regresses beyond criterion's default noise threshold; a missing
      # previous artifact (first run / retention expiry) just saves fresh.
      - name: Download previous baseline
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: nightly.yml
          name: criterion-baseline
          path: src-tauri/target/criterion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run benches
        run: cargo bench --bench perf -- --baseline nightly --save-baseline nightly

      - name: Upload criterion reports
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.run_id }}
          path: src-tauri/target/criterion
          retention-days: 14

      - name: Upload baseline for next run
        uses: actions/upload-artifact@v4
        with:
          name: criterion-baseline
          path: src-tauri/target/criterion
          retention-days: 90
          overwrite: true

  nightly-soak:
    name: Long-run tests + watcher soak
    runs-on: ubuntu-latest
    timeout-minutes: 600
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # git for the test suite's real-repo fixtures; GTK/WebKit for the Tauri build.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y git libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev pkg-config patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: soak-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Generate test fixtures
        shell: bash
        run: bash ../scripts/make-fixtures.sh

      - name: Full test suite
        run: cargo test

      # Watcher-leak soak: churn the workdir under a live watcher and sample
      # process RSS once a second (M12: examples/soak.rs replaces the
      # placeholder stub). Fails when RSS crosses the 250MB plan gate or
      # grows monotonically for 5 straight minutes. 30 minutes on nightly;
      # the full 8h gate is a workflow_dispatch run with SOAK_MINUTES=480.
      - name: Watcher soak (RSS bounded under churn)
        run: cargo run --release --example soak -- --minutes "${SOAK_MINUTES:-30}" --max-rss-mb 250
        env:
          SOAK_MINUTES: 30
