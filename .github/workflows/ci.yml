name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test / check / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # node_modules cache keyed on the lockfile so `npm ci` is fast on re-runs.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm run test

      - name: Type check (svelte-check)
        run: npm run check

      - name: Build (vite)
        run: npm run build

      # M12: Playwright smoke flows against the Vite dev server with a
      # mocked Tauri IPC bridge (e2e/tauri-mock.ts) — SPA-level coverage of
      # boot → open repo → stage → commit, no native build needed.
      - name: Playwright smoke
        run: npx playwright install --with-deps chromium && npm run test:e2e

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # Same package set release.yml installs: Tauri's Linux backend links
      # against GTK/WebKit, which ubuntu runners don't ship by default.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev pkg-config patchelf

      - name: Setup Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cargo registry/git sources + build cache, keyed on Cargo.lock.
      #
      # NOTE(M1): the git2 crate (libgit2) lands in M1. It vendors its own
      # libgit2 via cc/cmake and needs no extra system packages, but CMake and
      # a C toolchain are required on all three OS images (already present on
      # GitHub runners). If we later switch to the system libgit2, ubuntu will
      # need `apt-get install -y libgit2-dev cmake` here.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy -- -D warnings

      # Engine tests open fixture repos (fixtures/ is generated output, not
      # committed). The script sets a local git identity inside each fixture,
      # which CI runners need anyway.
      - name: Generate test fixtures
        shell: bash
        run: bash ../scripts/make-fixtures.sh

      - name: Tests
        run: cargo test
