name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-draft-release:
    permissions:
      contents: write
    env:
      # Empty by default (secrets unset) — both updater steps then no-op.
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows -> NSIS installer (.exe)
          - platform: windows-latest
            args: ''
          # linux  -> AppImage + .deb
          - platform: ubuntu-22.04
            args: ''
          # macos  -> .dmg
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Updater endpoint: when a pubkey is configured (TAURI_UPDATER_PUBKEY
      # secret), overlay tauri.conf.json so the bundled updater polls the
      # latest.json artifact this release publishes. Empty secret = no
      # overlay (updater stays inert, exactly as shipped today).
      - name: Prepare updater config overlay
        id: updater-config
        if: env.TAURI_UPDATER_PUBKEY != ''
        shell: bash
        run: |
          cat > updater-overlay.json <<EOF
          {
            "bundle": {
              "createUpdaterArtifacts": true
            },
            "plugins": {
              "updater": {
                "pubkey": "${TAURI_UPDATER_PUBKEY}",
                "endpoints": [
                  "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
                ]
              }
            }
          }
          EOF
          echo "args=--config updater-overlay.json" >> "$GITHUB_OUTPUT"

      # Tauri updater signing (M12 wiring). Secrets are NOT invented here:
      # generate a keypair with `cargo tauri signer generate -w ~/.tauri/`,
      # store the private key + password as the two repo secrets below and
      # the minisign pubkey in tauri.conf.json `plugins.updater.pubkey`.
      # When the secrets are absent the env vars resolve empty and
      # tauri-action skips signing (releases still build, just unsigned).
      - name: Build and draft release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'mygitui ${{ github.ref_name }}'
          releaseBody: 'Draft release built from tag ${{ github.ref_name }}. Download the artifact for your platform from the assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater-config.outputs.args }}
