name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-draft-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows -> NSIS installer (.exe)
          - platform: windows-latest
            args: ''
          # linux  -> AppImage + .deb
          - platform: ubuntu-22.04
            args: ''
          # macos  -> .dmg
          - platform: macos-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Tauri updater signing keys are configured in M8 (packaging + updater
      # release). Placeholders only — do NOT invent secrets. When the keys
      # exist, uncomment the two env vars in the tauri-action step below so
      # .sig files are generated for the updater.
      # - name: Expose updater signing key
      #   env:
      #     TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      #     TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      #   run: echo "signing enabled"

      - name: Build and draft release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing (M8) — uncomment once secrets are configured:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'mygitui ${{ github.ref_name }}'
          releaseBody: 'Draft release built from tag ${{ github.ref_name }}. Download the artifact for your platform from the assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
