name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Packaging (installers, updater artifacts) is rebuilt separately after the
# iced migration; until then a release publishes the raw release binary per
# platform as a tar.gz so day-to-day builds have a downloadable artifact.
jobs:
  build-and-draft-release:
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            binary: mygitui.exe
          - platform: ubuntu-22.04
            binary: mygitui
          - platform: macos-latest
            binary: mygitui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libxkbcommon-dev libwayland-dev

      - name: Build (release)
        working-directory: app
        run: cargo build --release --bin mygitui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          out="mygitui-${{ github.ref_name }}-${{ runner.os }}"
          tar -czf "dist/${out}.tar.gz" -C app/target/release "${{ matrix.binary }}"

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'mygitui ${{ github.ref_name }}'
          body: 'Draft release built from tag ${{ github.ref_name }}. Raw release binaries per platform; installers are rebuilt after the native-UI migration.'
          draft: true
          prerelease: false
          files: dist/*.tar.gz
