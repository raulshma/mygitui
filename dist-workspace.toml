[workspace]
# The cargo workspace (and the app crate) live in `app/`; dist itself runs
# from the repo root so the generated workflow needs no working-directory
# patches.
members = ["cargo:app"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# The generated release workflow carries hand-added packaging jobs (Linux
# AppImage, macOS .app bundles — installers dist 0.28 no longer emits);
# without this, every dist command demands a regeneration that would drop
# them.
allow-dirty = ["ci"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# GitHub retired ubuntu-20.04; the plan/global/host jobs default to it.
# macos-13/windows-2019 are retired too; the arm macs cross-build the intel
# slice fine.
[dist.github-custom-runners]
global = "ubuntu-22.04"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"
