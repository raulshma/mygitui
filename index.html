<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mygitui</title>
    <script>
      // Only the first load in a webview session needs the boot splash. A
      // mid-session reload (Vite HMR/optimizer, error recovery) mounts the
      // app shell immediately, so keep the splash out of the way instead of
      // flashing a full-screen overlay over whatever the user was doing.
      try {
        if (sessionStorage.getItem("mygitui.booted") === "1") {
          document.documentElement.classList.add("app-booted");
        }
      } catch {
        // sessionStorage unavailable: keep the normal launch splash.
      }
    </script>
    <style>
      /* Pre-paint + splash: the native window background (tauri.conf.json
         `backgroundColor`) and this HTML background share one dark tone, so
         launch never flashes white. The splash overlay renders on first
         parse — before the app bundle has loaded — and App.svelte fades it
         out once the app shell has mounted. */
      html {
        background: #0a0a0a;
      }
      html.app-booted #app-splash {
        display: none;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a0a;
        font-family: Inter, Roboto, "Segoe UI", system-ui, sans-serif;
        animation: app-splash-expire 0.2s ease 8s forwards;
      }
      #app-splash svg {
        width: 56px;
        height: 56px;
        color: #fafafa;
      }
      #app-splash .app-splash__name {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #a3a3a3;
      }
      #app-splash .app-splash__spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(250, 250, 250, 0.22);
        border-top-color: #fafafa;
        animation: app-splash-spin 0.8s linear infinite;
      }
      #app-splash.app-splash--done {
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes app-splash-expire {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <circle cx="6" cy="6" r="2.4" />
        <circle cx="6" cy="18" r="2.4" />
        <circle cx="18" cy="12" r="2.4" />
        <path d="M6 8.4v7.2" />
        <path d="M15.7 10.9c-2.6-.9-6-.3-7.5 1.7" />
      </svg>
      <div class="app-splash__name">mygitui</div>
      <div class="app-splash__spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
